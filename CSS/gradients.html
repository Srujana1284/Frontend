<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <style>
       #lg {
        height: 200px;
        width: 100%;
        background-color: crimson;
     /*   background: linear-gradient(red,yellow); /*No direction specified top to bottom*/
   /*  background: linear-gradient(to right,red, yellow,orange,plum,green); */
 /*  background: linear-gradient(45deg,red, yellow,orange,plum,green); */
    background: linear-gradient(to right, red 20%, yellow 60%, rgb(15, 222, 15) 100%);
       } 
       #rg {
        height: 150px;
        width: 400px;
        background-color: deeppink;
      /*  background: radial-gradient(navy,deeppink); */ /*Eliptical/Radial default*/
    /* background: radial-gradient(circle, blue, white,deeppink, green); /*circular gradient*/
    background: radial-gradient(circle at top left,red,yellow,deeppink,orange);
       }

       #cg {
        width: 200px;
        height: 200px;
        background-color: blue;
        border-radius: 50%;
       /* background: conic-gradient(red,yellow,deeppink,blue,green); */
       background: conic-gradient(yellow 0deg 90deg, deeppink 90deg 180deg, orange 180deg 300deg, blue 300deg 360deg );

       }
    </style>
</head>
<body>
    <h1>Linear Gradient</h1>
    <div id="lg"></div>
    <h1>Radial Gradient</h1>
    <div id="rg"></div>
    <h1>Conical Gradient</h1> 
    <div id="cg"></div>
</body>
</html>
