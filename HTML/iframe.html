<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe in HTML</title>
</head>
<body>
    <h1>My webpage</h1>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. 
        Voluptatem, error. Recusandae, minus error sapiente odit 
        aspernatur quasi beatae expedita, esse iure ipsa assumenda 
        eveniet modi distinctio praesentium illo impedit ab!
    </p>

    <!-- iframe 1 -->
    <iframe src="https://www.kodnest.com" 
            name="frame1" 
            width="600px" 
            height="300px" 
            scrolling="no" 
            frameborder="0">
    </iframe>

    <!-- iframe 2 -->
    <iframe 
        srcdoc="<h1>My own webpage</h1><a href='https://www.kodnest.com' target="frame3">Click here to visit kodnest</a>">
    </iframe>

    <!-- iframe 3 -->
    <iframe 
        src="https://www.flipkart.com" 
        name="frame2" 
        height="300px" 
        title="It presents Flipkart website">
    </iframe>

</body>
</html>
