<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add & Remove Elements</title>
    <style>
        /* Styling the dynamically created boxes */
        div {
            height: 100px;
            width: 200px;
            background-color: blue;
            border: 4px solid aqua;
            margin: 10px 0; /* Adds spacing between the boxes */
        }
        
        /* Optional styling for buttons to make them look neat */
        button {
            padding: 8px 16px;
            font-size: 16px;
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>DOM Manipulation</h1>
    
    <!-- Buttons attached to the JavaScript functions via onClick -->
    <button onclick="addBox()">Add box</button>
    <button onclick="removeBox()">Remove box</button>
    <br><br>

    <script>
        // Function to dynamically create and append a new 'div' element to the body
        function addBox() {
            // 1. Select the target parent element (the <body>)
            let b = document.querySelector("body");
            
            // 2. Create the new 'div' element
            let newDiv = document.createElement("div");
            
            // 3. Append the newly created element into the parent
            b.appendChild(newDiv);
        }

        // Function to remove a 'div' element from the body
        function removeBox() {
            // 1. Select the target parent element
            let b = document.querySelector("body");
            
            // 2. Select the first matching 'div' element on the page
            let itemDiv = document.querySelector("div");
            
            // 3. If a div exists, remove it from the parent to avoid errors
            if (itemDiv) {
                b.removeChild(itemDiv);
            } else {
                console.log("No boxes left to remove!");
            }
        }
    </script>
    
</body>
</html>
