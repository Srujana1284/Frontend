    <script>
      //  const a = 10; //cant reinitialize,cant redeclare
        var a = 10;
      // let a = 10; //let can be reinitialised not redeclared
        a = 20; //re-initialize
        var a = 30;  //redeclare
        console.log(a);

        //scope-function var
        function varvari() {
            var name = "Interstellar";
            console.log(name); //can be accessed nly inside function
        }

        /*console.log(name); - Error cant be accessed outside function*/

        //scope - let & const (block-scpes)
        if(true) {
            let z = 100;
            const pi = 3.14;
            console.log(z);
            console.log(pi);
        }

        /*console.log(z) - let,const;  error-outside block as it cant be accessed*/
