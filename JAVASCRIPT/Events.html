<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <style>
        body {
            height: 300vh;
        }
        #myDiv{
            width: 100px;
            height: 100px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h2>Mouse Events</h2>
    <br>
    <div id="myDiv"></div>
    <br>
    <input type="text">
    <form>
        <label>Enter name:</label>
        <input type="text" id="myInput">
        <br>
        <br>
        <button type="submit">Submit</button>
    </form>
    <script>
        //form events
        document.querySelector("form").addEventListener("submit", (e) => {
            e.preventDefault();
            alert("Form Submitted");
        });

        document.querySelector('#myInput').addEventListener('focus', () => {
        console.log('Input field focused!');
        });

        document.querySelector('#myInput').addEventListener('blur', () => {
        console.log('Input field lost focus!');
       });

       document.querySelector('#myInput').addEventListener('change', (event) => {
        console.log(`Input field value changed to: ${event.target.value}`);
        });

        document.querySelector('#myInput').addEventListener('input', (event) => {
        console.log(`Input field value changed to: ${event.target.value}`);
        });

        //mouse events
        let box = document.getElementById("myDiv");
        box.addEventListener("click", () => {
            box.style.backgroundColor = "hotpink";
        });
        box.addEventListener("dblclick", () => {
            box.style.backgroundColor = "yellow";
            box.innerText = "Double Clicked";
        });
        box.addEventListener("mouseover", () => {
            box.style.backgroundColor = "lightgreen";
        });
        box.addEventListener("mouseout", () => {
            box.style.backgroundColor = "orange";
        });
        box.addEventListener("mousemove" , (e) => {
            box.innerText = `X value: ${e.offsetX} and Y value: ${e.offsetY}`;
            alert("Warning: Don't move the mouse too much, it will trigger multiple alerts!");
        });


        //Keyboard Events
        let i = document.querySelector("input");
        i.addEventListener("keydown", (event) => {
           console.log("The key pressed is: " + event.key);
        });
        i.addEventListener("keyup", (event) => {
           console.log("The key released is: " + event.key);
        });
        i.addEventListener("keypress", (e) => {
            const pattern = "/^[a-zA-Z]$/";

            if(!pattern.test(e.key)) {
                e.preventDefault();
            }
        });


        //Window Events
        window.addEventListener("DOMContentLoaded", () => {
            alert("Content Loaded");
        });

        window.addEventListener("resize", () => {
            alert("Window resized to: " + window.innerWidth + "x" + window.innerHeight);
        });

        window.addEventListener("scroll", () => {
            console.log("Window scrolled to: " , window.scrollY);
        });


    </script>
</body>
</html>
